<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>EGO.XD — Téléchargement</title>
<style>
body{font-family:system-ui;background:#0b0b12;color:#e2e8f0;margin:0;padding:20px;max-width:480px;margin-inline:auto;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#141422;border-radius:14px;padding:28px;width:100%;text-align:center}
.icon{font-size:40px;margin-bottom:8px}
.name{font-weight:700;word-break:break-all;margin-bottom:4px}
.meta{color:#94a3b8;font-size:13px;margin-bottom:20px}
.btn{display:inline-block;background:#8b5cf6;color:#fff;text-decoration:none;padding:12px 28px;border-radius:10px;font-weight:700}
.btn:active{opacity:.8}
.err{color:#ef4444}
</style>
</head>
<body>
<div class="card" id="card">Chargement…</div>
<script>
const id = location.pathname.split('/').filter(Boolean).pop();
fetch('/api/files/' + id).then(r => {
  if (!r.ok) throw new Error('not found');
  return r.json();
}).then(d => {
  const sizeMb = (d.size / (1024 * 1024)).toFixed(2);
  document.getElementById('card').innerHTML = `
    <div class="icon">📁</div>
    <div class="name">${d.filename}</div>
    <div class="meta">${sizeMb} MB · ${d.downloads} téléchargement(s)</div>
    <a class="btn" href="/dl/${id}">Télécharger</a>
  `;
}).catch(() => {
  document.getElementById('card').innerHTML = '<div class="err">Fichier introuvable ou expiré.</div>';
});
</script>
</body>
</html>
