<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EGO.XD — Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <main class="wrap">

    <!-- ─── Carte identité ─── -->
    <section class="card identity">
      <div class="avatar-ring">
        <div class="avatar">⛩</div>
      </div>
      <h1 class="title">EGO<span class="accent">.XD</span></h1>
      <p class="subtitle">Développé par Dylan — Bot WhatsApp · Blue Lock · Ego Jinpachi</p>

      <div class="stats-row">
        <div class="stat">
          <span class="stat-value" id="stat-sessions">—</span>
          <span class="stat-label">Sessions</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <span class="stat-value" id="stat-connected">—</span>
          <span class="stat-label">Connectées</span>
        </div>
      </div>

      <div class="status-badge">
        <span class="status-dot"></span> En ligne
      </div>
    </section>

    <!-- ─── Carte de connexion ─── -->
    <section class="card pairing">
      <h2 class="pairing-title">
        <span class="wa-icon">◉</span> Connecte ton WhatsApp
      </h2>
      <p class="pairing-desc">Entre ton numéro pour générer un code d'appairage</p>

      <form id="pair-form" class="pair-form">
        <div class="phone-input">
          <span class="plus">+</span>
          <input
            type="tel"
            id="phone"
            placeholder="2250000000000"
            autocomplete="off"
            inputmode="numeric"
            required
          >
        </div>

        <button type="submit" class="generate-btn" id="generate-btn">
          <span class="btn-icon">⛓</span> Générer le code
        </button>
      </form>

      <div id="result" class="result hidden"></div>
    </section>

    <footer class="footer">
      <p>EGO.XD — Session privée · Ne partage jamais ton code</p>
    </footer>

  </main>

<script src="/script.js"></script>
</body>
</html>
